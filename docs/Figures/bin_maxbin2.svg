<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="asg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8a97a3"/>
    </marker>
    <style>
      .ttl {font-size:23px;font-weight:700;fill:#027373;}
      .sub {font-size:12.5px;fill:#6b7a89;}
      .cap {font-size:12px;fill:#42505e;}
      .lgd {font-size:11.5px;fill:#42505e;}
    </style>
  </defs>
  <rect x="6" y="6" width="588" height="458" rx="14" fill="#ffffff" stroke="#e2e6ea" stroke-width="1.5"/>
  <text x="34" y="44" class="ttl">MaxBin2</text>
  <text x="34" y="66" class="sub">+ genes marcadores de copia única como semilla · algoritmo EM</text>

  <!-- Seed 1 (teal) -->
  <g stroke="#9fb0bd" stroke-width="1.3" stroke-dasharray="4 3">
    <line x1="180" y1="175" x2="130" y2="150" marker-end="url(#asg)"/>
    <line x1="180" y1="175" x2="140" y2="215" marker-end="url(#asg)"/>
    <line x1="180" y1="175" x2="235" y2="160" marker-end="url(#asg)"/>
    <line x1="180" y1="175" x2="230" y2="210" marker-end="url(#asg)"/>
  </g>
  <g fill="#027373">
    <circle cx="130" cy="150" r="5.5"/><circle cx="140" cy="215" r="5.5"/>
    <circle cx="235" cy="160" r="5.5"/><circle cx="230" cy="210" r="5.5"/>
  </g>
  <g transform="translate(180,175)" fill="#E8663A" stroke="#b64420" stroke-width="0.8">
    <path d="M0,-13 L3.8,-4 L12.4,-4 L5.6,1.6 L7.6,10.2 L0,5.2 L-7.6,10.2 L-5.6,1.6 L-12.4,-4 L-3.8,-4 Z"/>
  </g>

  <!-- Seed 2 (amber) -->
  <g stroke="#9fb0bd" stroke-width="1.3" stroke-dasharray="4 3">
    <line x1="400" y1="270" x2="350" y2="250" marker-end="url(#asg)"/>
    <line x1="400" y1="270" x2="360" y2="310" marker-end="url(#asg)"/>
    <line x1="400" y1="270" x2="455" y2="258" marker-end="url(#asg)"/>
    <line x1="400" y1="270" x2="450" y2="305" marker-end="url(#asg)"/>
  </g>
  <g fill="#E0A13C">
    <circle cx="350" cy="250" r="5.5"/><circle cx="360" cy="310" r="5.5"/>
    <circle cx="455" cy="258" r="5.5"/><circle cx="450" cy="305" r="5.5"/>
  </g>
  <g transform="translate(400,270)" fill="#E8663A" stroke="#b64420" stroke-width="0.8">
    <path d="M0,-13 L3.8,-4 L12.4,-4 L5.6,1.6 L7.6,10.2 L0,5.2 L-7.6,10.2 L-5.6,1.6 L-12.4,-4 L-3.8,-4 Z"/>
  </g>

  <!-- legend -->
  <g transform="translate(150,368)" fill="#E8663A" stroke="#b64420" stroke-width="0.8">
    <path d="M0,-9 L2.6,-2.8 L8.6,-2.8 L3.9,1.1 L5.3,7 L0,3.6 L-5.3,7 L-3.9,1.1 L-8.6,-2.8 L-2.6,-2.8 Z"/>
  </g>
  <text x="165" y="372" class="lgd">= contig con gen marcador de copia única (semilla)</text>

  <text x="34" y="418" class="cap">Toma contigs con genes marcadores como semilla y, con un algoritmo EM, asigna el resto</text>
  <text x="34" y="436" class="cap">por cobertura, composición y GC. Los marcadores le permiten además estimar completitud.</text>
</svg>

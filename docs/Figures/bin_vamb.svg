<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="fl" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#027373"/>
    </marker>
    <style>
      .ttl {font-size:23px;font-weight:700;fill:#027373;}
      .sub {font-size:12.5px;fill:#6b7a89;}
      .cap {font-size:12px;fill:#42505e;}
      .lab {font-size:11px;fill:#6b7a89;}
      .labB{font-size:11.5px;font-weight:700;fill:#027373;}
      .note{font-size:10px;fill:#a0abb5;font-style:italic;}
      .nd  {fill:#ffffff;stroke:#027373;stroke-width:1.6;}
      .ln  {stroke:#cfe6e0;stroke-width:1;}
      .ndF {fill:#ffffff;stroke:#027373;stroke-width:1.4;opacity:0.38;}
      .lnF {stroke:#cfe6e0;stroke-width:1;opacity:0.5;}
    </style>
  </defs>
  <rect x="6" y="6" width="588" height="458" rx="14" fill="#ffffff" stroke="#e2e6ea" stroke-width="1.5"/>
  <text x="34" y="44" class="ttl">VAMB</text>
  <text x="34" y="66" class="sub">autoencoder variacional (deep learning)</text>

  <!-- input feature bars -->
  <text x="72" y="150" class="lab" text-anchor="middle">cientos de rasgos</text>
  <text x="72" y="164" class="lab" text-anchor="middle">por contig</text>
  <g fill="#6FD2BE" stroke="#027373" stroke-width="0.8">
    <rect x="44" y="230" width="8" height="70"/>
    <rect x="54" y="205" width="8" height="95"/>
    <rect x="64" y="250" width="8" height="50"/>
    <rect x="74" y="190" width="8" height="110"/>
    <rect x="84" y="240" width="8" height="60"/>
    <rect x="94" y="215" width="8" height="85"/>
  </g>
  <text x="72" y="316" class="note" text-anchor="middle">k-mers + abundancia</text>

  <line x1="112" y1="245" x2="140" y2="245" stroke="#027373" stroke-width="2" marker-end="url(#fl)"/>

  <!-- encoder funnel -->
  <g class="ln">
    <!-- col1 (6) to col2 (4) -->
    <line x1="150" y1="165" x2="205" y2="187"/><line x1="150" y1="165" x2="205" y2="243"/>
    <line x1="150" y1="193" x2="205" y2="187"/><line x1="150" y1="193" x2="205" y2="215"/>
    <line x1="150" y1="221" x2="205" y2="215"/><line x1="150" y1="221" x2="205" y2="243"/>
    <line x1="150" y1="249" x2="205" y2="215"/><line x1="150" y1="249" x2="205" y2="271"/>
    <line x1="150" y1="277" x2="205" y2="243"/><line x1="150" y1="277" x2="205" y2="271"/>
    <line x1="150" y1="305" x2="205" y2="271"/>
    <!-- col2 (4) to bottleneck (2) -->
    <line x1="205" y1="187" x2="255" y2="207"/><line x1="205" y1="187" x2="255" y2="235"/>
    <line x1="205" y1="215" x2="255" y2="207"/><line x1="205" y1="215" x2="255" y2="235"/>
    <line x1="205" y1="243" x2="255" y2="207"/><line x1="205" y1="243" x2="255" y2="235"/>
    <line x1="205" y1="271" x2="255" y2="207"/><line x1="205" y1="271" x2="255" y2="235"/>
  </g>
  <g class="nd">
    <circle cx="150" cy="165" r="6"/><circle cx="150" cy="193" r="6"/><circle cx="150" cy="221" r="6"/>
    <circle cx="150" cy="249" r="6"/><circle cx="150" cy="277" r="6"/><circle cx="150" cy="305" r="6"/>
    <circle cx="205" cy="187" r="6"/><circle cx="205" cy="215" r="6"/><circle cx="205" cy="243" r="6"/><circle cx="205" cy="271" r="6"/>
    <circle cx="255" cy="207" r="6"/><circle cx="255" cy="235" r="6"/>
  </g>
  <text x="180" y="335" class="lab" text-anchor="middle">codificador (comprime)</text>

  <!-- latent space box -->
  <rect x="278" y="160" width="120" height="122" rx="9" fill="#e6f5f1" stroke="#027373" stroke-width="1.6"/>
  <text x="338" y="180" class="labB" text-anchor="middle">espacio latente</text>
  <g fill="#027373"><circle cx="312" cy="212" r="5"/><circle cx="324" cy="224" r="5"/><circle cx="310" cy="232" r="5"/></g>
  <g fill="#E8663A"><circle cx="366" cy="220" r="5"/><circle cx="356" cy="238" r="5"/><circle cx="372" cy="248" r="5"/></g>
  <text x="338" y="304" class="lab" text-anchor="middle">mismo genoma → juntos</text>

  <!-- decoder funnel (faded) -->
  <g class="lnF">
    <line x1="418" y1="207" x2="468" y2="187"/><line x1="418" y1="207" x2="468" y2="215"/>
    <line x1="418" y1="235" x2="468" y2="243"/><line x1="418" y1="235" x2="468" y2="271"/>
    <line x1="418" y1="207" x2="468" y2="243"/><line x1="418" y1="235" x2="468" y2="215"/>
    <line x1="468" y1="187" x2="520" y2="165"/><line x1="468" y1="187" x2="520" y2="193"/>
    <line x1="468" y1="215" x2="520" y2="193"/><line x1="468" y1="215" x2="520" y2="221"/>
    <line x1="468" y1="243" x2="520" y2="221"/><line x1="468" y1="243" x2="520" y2="249"/>
    <line x1="468" y1="271" x2="520" y2="249"/><line x1="468" y1="271" x2="520" y2="277"/>
  </g>
  <g class="ndF">
    <circle cx="418" cy="207" r="6"/><circle cx="418" cy="235" r="6"/>
    <circle cx="468" cy="187" r="6"/><circle cx="468" cy="215" r="6"/><circle cx="468" cy="243" r="6"/><circle cx="468" cy="271" r="6"/>
    <circle cx="520" cy="165" r="6"/><circle cx="520" cy="193" r="6"/><circle cx="520" cy="221" r="6"/>
    <circle cx="520" cy="249" r="6"/><circle cx="520" cy="277" r="6"/><circle cx="520" cy="305" r="6"/>
  </g>
  <text x="470" y="335" class="note" text-anchor="middle">decodificador: reconstruye</text>
  <text x="470" y="349" class="note" text-anchor="middle">(solo sirve para entrenar)</text>

  <text x="34" y="418" class="cap">Comprime los cientos de rasgos de cada contig a unas pocas coordenadas: el espacio latente.</text>
  <text x="34" y="436" class="cap">En ese mapa comprimido, los contigs de un mismo genoma quedan juntos y se agrupan en bins.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="pull" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L5.5,3 L0,6 Z" fill="#027373"/>
    </marker>
    <marker id="push" markerWidth="7" markerHeight="7" refX="5.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L5.5,3 L0,6 Z" fill="#E8663A"/>
    </marker>
    <marker id="flow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#027373"/>
    </marker>
    <style>
      .ttl {font-size:23px;font-weight:700;fill:#027373;}
      .sub {font-size:12.5px;fill:#6b7a89;}
      .cap {font-size:12px;fill:#42505e;}
      .hd  {font-size:11.5px;font-weight:700;fill:#6b7a89;}
      .rl  {font-size:11px;font-weight:700;fill:#42505e;}
      .flw {font-size:12px;font-weight:700;fill:#027373;}
      .note{font-size:10px;fill:#a0abb5;font-style:italic;}
    </style>
  </defs>
  <rect x="6" y="6" width="588" height="458" rx="14" fill="#ffffff" stroke="#e2e6ea" stroke-width="1.5"/>
  <text x="34" y="44" class="ttl">COMEBin</text>
  <text x="34" y="66" class="sub">aprendizaje contrastivo (deep learning)</text>

  <!-- LEFT: antes (mixed) -->
  <text x="105" y="142" class="hd" text-anchor="middle">antes: contigs mezclados</text>
  <rect x="36" y="152" width="140" height="180" rx="10" fill="#fbfdfd" stroke="#e2e6ea" stroke-width="1.3"/>
  <g fill="#027373">
    <circle cx="72" cy="196" r="6"/><circle cx="114" cy="228" r="6"/><circle cx="88" cy="266" r="6"/><circle cx="134" cy="296" r="6"/><circle cx="64" cy="304" r="6"/>
  </g>
  <g fill="#E8663A">
    <circle cx="100" cy="182" r="6"/><circle cx="146" cy="210" r="6"/><circle cx="78" cy="238" r="6"/><circle cx="124" cy="262" r="6"/><circle cx="104" cy="312" r="6"/>
  </g>

  <!-- MIDDLE: the rule -->
  <text x="300" y="142" class="hd" text-anchor="middle">la regla que aprende</text>

  <!-- acercar -->
  <circle cx="270" cy="180" r="6.5" fill="#027373"/>
  <circle cx="330" cy="180" r="6.5" fill="#027373"/>
  <line x1="248" y1="180" x2="262" y2="180" stroke="#027373" stroke-width="2.2" marker-end="url(#pull)"/>
  <line x1="352" y1="180" x2="338" y2="180" stroke="#027373" stroke-width="2.2" marker-end="url(#pull)"/>
  <text x="300" y="205" class="rl" text-anchor="middle" fill="#027373">acercar lo parecido</text>
  <text x="300" y="219" class="note" text-anchor="middle">(mismo genoma)</text>

  <!-- alejar -->
  <circle cx="270" cy="250" r="6.5" fill="#027373"/>
  <circle cx="330" cy="250" r="6.5" fill="#E8663A"/>
  <line x1="256" y1="250" x2="242" y2="250" stroke="#E8663A" stroke-width="2.2" marker-end="url(#push)"/>
  <line x1="344" y1="250" x2="358" y2="250" stroke="#E8663A" stroke-width="2.2" marker-end="url(#push)"/>
  <text x="300" y="275" class="rl" text-anchor="middle" fill="#E8663A">alejar lo diferente</text>
  <text x="300" y="289" class="note" text-anchor="middle">(distinto genoma)</text>

  <!-- transformation arrow -->
  <line x1="182" y1="315" x2="418" y2="315" stroke="#027373" stroke-width="2.4" marker-end="url(#flow)"/>
  <text x="300" y="333" class="flw" text-anchor="middle">aprendizaje contrastivo</text>

  <!-- RIGHT: despues (separated) -->
  <text x="495" y="142" class="hd" text-anchor="middle">después: espacio aprendido</text>
  <rect x="424" y="152" width="140" height="180" rx="10" fill="#fbfdfd" stroke="#e2e6ea" stroke-width="1.3"/>
  <ellipse cx="470" cy="200" rx="30" ry="26" fill="none" stroke="#027373" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g fill="#027373">
    <circle cx="458" cy="194" r="6"/><circle cx="480" cy="204" r="6"/><circle cx="466" cy="214" r="6"/><circle cx="486" cy="190" r="6"/>
  </g>
  <ellipse cx="518" cy="282" rx="30" ry="26" fill="none" stroke="#E8663A" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g fill="#E8663A">
    <circle cx="506" cy="276" r="6"/><circle cx="528" cy="286" r="6"/><circle cx="512" cy="294" r="6"/><circle cx="532" cy="272" r="6"/>
  </g>

  <text x="34" y="410" class="cap">Aprende un espacio donde acerca los contigs parecidos y aleja los diferentes; sobre ese</text>
  <text x="34" y="428" class="cap">espacio, los de un mismo genoma quedan agrupados en clusters claros.</text>
  <text x="34" y="448" class="note">Genera varias "vistas" de cada contig y las trata como parejas "parecidas" para aprender rasgos robustos.</text>
</svg>

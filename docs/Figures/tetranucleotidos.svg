<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 745" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#027373"/>
    </marker>
    <style>
      .ttl {font-size:18px;font-weight:700;fill:#0c2e42;}
      .sub {font-size:12.5px;fill:#6b7a89;}
      .step{font-size:13.5px;font-weight:700;fill:#027373;}
      .cap {font-size:11.5px;fill:#42505e;}
      .lab {font-size:11px;fill:#6b7a89;}
      .base{font-size:17px;font-weight:700;}
      .bcmp{font-size:15px;font-weight:700;opacity:0.55;}
      .kmer{font-size:12px;font-weight:700;fill:#0c2e42;letter-spacing:1px;}
      .end {font-size:10px;font-weight:700;fill:#8a97a3;}
    </style>
  </defs>
  <rect width="680" height="745" fill="#ffffff"/>
  <text x="30" y="34" class="ttl">Frecuencia de tetranucleótidos: la firma de composición de un contig</text>  <text x="30" y="54" class="sub">Cómo se cuentan los k-mers (k = 4) — y por qué se cuentan en las dos hebras</text>

  <!-- STEP 1 -->
  <text x="30" y="90" class="step">1 · Se recorren ventanas de 4 bases a lo largo del contig</text>

  <!-- double strand tiles -->
  <text x="118" y="128" class="end" text-anchor="end">5′</text>
  <text x="118" y="160" class="end" text-anchor="end">3′</text>
  <text x="522" y="128" class="end">3′</text>
  <text x="522" y="160" class="end">5′</text>
  <g>
    <!-- top strand: A A C C G G T T A C -->
    <g font-family="Arial">
      <text x="140" y="126" class="base" fill="#3aa66b" text-anchor="middle">A</text>
      <text x="174" y="126" class="base" fill="#3aa66b" text-anchor="middle">A</text>
      <text x="208" y="126" class="base" fill="#2b7fb8" text-anchor="middle">C</text>
      <text x="242" y="126" class="base" fill="#2b7fb8" text-anchor="middle">C</text>
      <text x="276" y="126" class="base" fill="#c98a2b" text-anchor="middle">G</text>
      <text x="310" y="126" class="base" fill="#c98a2b" text-anchor="middle">G</text>
      <text x="344" y="126" class="base" fill="#cf5b5b" text-anchor="middle">T</text>
      <text x="378" y="126" class="base" fill="#cf5b5b" text-anchor="middle">T</text>
      <text x="412" y="126" class="base" fill="#3aa66b" text-anchor="middle">A</text>
      <text x="446" y="126" class="base" fill="#2b7fb8" text-anchor="middle">C</text>
    </g>
    <!-- bottom strand (complement): T T G G C C A A T G -->
    <g font-family="Arial">
      <text x="140" y="158" class="bcmp" fill="#cf5b5b" text-anchor="middle">T</text>
      <text x="174" y="158" class="bcmp" fill="#cf5b5b" text-anchor="middle">T</text>
      <text x="208" y="158" class="bcmp" fill="#c98a2b" text-anchor="middle">G</text>
      <text x="242" y="158" class="bcmp" fill="#c98a2b" text-anchor="middle">G</text>
      <text x="276" y="158" class="bcmp" fill="#2b7fb8" text-anchor="middle">C</text>
      <text x="310" y="158" class="bcmp" fill="#2b7fb8" text-anchor="middle">C</text>
      <text x="344" y="158" class="bcmp" fill="#3aa66b" text-anchor="middle">A</text>
      <text x="378" y="158" class="bcmp" fill="#3aa66b" text-anchor="middle">A</text>
      <text x="412" y="158" class="bcmp" fill="#cf5b5b" text-anchor="middle">T</text>
      <text x="446" y="158" class="bcmp" fill="#c98a2b" text-anchor="middle">G</text>
    </g>
    <line x1="128" y1="140" x2="460" y2="140" stroke="#e2e6ea" stroke-width="1"/>
    <!-- window -->
    <rect x="123" y="108" width="136" height="58" rx="6" fill="none" stroke="#027373" stroke-width="2"/>
  </g>

  <!-- 4-mer chips -->
  <g>
    <rect x="30" y="188" width="56" height="22" rx="4" fill="#e6f5f1" stroke="#027373" stroke-width="1.4"/><text x="58" y="203" class="kmer" text-anchor="middle">AACC</text>
    <rect x="92" y="188" width="56" height="22" rx="4" fill="#ffffff" stroke="#cfd8de" stroke-width="1"/><text x="120" y="203" class="kmer" text-anchor="middle">ACCG</text>
    <rect x="154" y="188" width="56" height="22" rx="4" fill="#ffffff" stroke="#cfd8de" stroke-width="1"/><text x="182" y="203" class="kmer" text-anchor="middle">CCGG</text>
    <rect x="216" y="188" width="56" height="22" rx="4" fill="#ffffff" stroke="#cfd8de" stroke-width="1"/><text x="244" y="203" class="kmer" text-anchor="middle">CGGT</text>
    <rect x="278" y="188" width="56" height="22" rx="4" fill="#fbe3da" stroke="#E8663A" stroke-width="1.4"/><text x="306" y="203" class="kmer" text-anchor="middle">GGTT</text>
    <rect x="340" y="188" width="56" height="22" rx="4" fill="#ffffff" stroke="#cfd8de" stroke-width="1"/><text x="368" y="203" class="kmer" text-anchor="middle">GTTA</text>
    <rect x="402" y="188" width="56" height="22" rx="4" fill="#ffffff" stroke="#cfd8de" stroke-width="1"/><text x="430" y="203" class="kmer" text-anchor="middle">TTAC</text>
    <text x="470" y="203" class="lab">…</text>
  </g>

  <line x1="30" y1="228" x2="650" y2="228" stroke="#eef1f3" stroke-width="1.5"/>

  <!-- STEP 2 -->
  <text x="30" y="256" class="step">2 · Cada tetranucleótido se cuenta junto con su reverso-complemento</text>
  <text x="30" y="274" class="cap">La hebra que se secuencia es arbitraria, así que leer <tspan font-weight="700" fill="#027373">AACC</tspan> en una hebra equivale a leer <tspan font-weight="700" fill="#E8663A">GGTT</tspan> en la otra.</text>

  <!-- pairing box -->
  <g>
    <text x="150" y="316" class="end" text-anchor="end">5′</text>
    <text x="150" y="342" class="end" text-anchor="end">3′</text>
    <text x="176" y="316" class="base" fill="#3aa66b" text-anchor="middle">A</text>
    <text x="206" y="316" class="base" fill="#3aa66b" text-anchor="middle">A</text>
    <text x="236" y="316" class="base" fill="#2b7fb8" text-anchor="middle">C</text>
    <text x="266" y="316" class="base" fill="#2b7fb8" text-anchor="middle">C</text>
    <text x="176" y="340" class="bcmp" fill="#cf5b5b" text-anchor="middle">T</text>
    <text x="206" y="340" class="bcmp" fill="#cf5b5b" text-anchor="middle">T</text>
    <text x="236" y="340" class="bcmp" fill="#c98a2b" text-anchor="middle">G</text>
    <text x="266" y="340" class="bcmp" fill="#c98a2b" text-anchor="middle">G</text>
    <line x1="163" y1="324" x2="280" y2="324" stroke="#e2e6ea" stroke-width="1"/>
    <text x="292" y="316" class="lab">← hebra de arriba: AACC</text>
    <text x="292" y="340" class="lab">← hebra de abajo (5′→3′): GGTT</text>
  </g>

  <g transform="translate(330,378)">
    <rect x="0" y="-16" width="322" height="26" rx="13" fill="#e6f5f1" stroke="#027373" stroke-width="1.4"/>
    <text x="20" y="1" class="cap" fill="#027373" font-weight="700">AACC = GGTT</text>
    <text x="104" y="1" class="cap" fill="#027373">→ 1 tetranucleótido canónico</text>
  </g>
  <text x="30" y="384" class="cap">Por eso los 256 tetranucleótidos posibles</text>
  <text x="30" y="400" class="cap">se colapsan en <tspan font-weight="700" fill="#0c2e42">136 canónicos</tspan>.</text>

  <line x1="30" y1="420" x2="650" y2="420" stroke="#eef1f3" stroke-width="1.5"/>

  <!-- STEP 3 -->
  <text x="30" y="448" class="step">3 · Las cuentas forman la firma de composición del contig</text>

  <!-- histogram -->
  <g>
    <line x1="60" y1="540" x2="470" y2="540" stroke="#8a97a3" stroke-width="1.4"/>
    <line x1="60" y1="540" x2="60" y2="466" stroke="#8a97a3" stroke-width="1.4"/>
    <text x="46" y="505" class="lab" text-anchor="middle" transform="rotate(-90 46 505)">frecuencia</text>
    <g fill="#6FD2BE" stroke="#027373" stroke-width="0.8">
      <rect x="72"  y="512" width="18" height="28"/>
      <rect x="94"  y="496" width="18" height="44"/>
      <rect x="116" y="520" width="18" height="20"/>
      <rect x="138" y="502" width="18" height="38"/>
      <rect x="160" y="484" width="18" height="56"/>
      <rect x="182" y="514" width="18" height="26"/>
      <rect x="204" y="490" width="18" height="50"/>
      <rect x="226" y="508" width="18" height="32"/>
      <rect x="248" y="498" width="18" height="42"/>
      <rect x="270" y="518" width="18" height="22"/>
      <rect x="292" y="506" width="18" height="34"/>
      <rect x="314" y="488" width="18" height="52"/>
      <rect x="336" y="512" width="18" height="28"/>
      <rect x="358" y="500" width="18" height="40"/>
      <rect x="380" y="520" width="18" height="20"/>
      <rect x="402" y="494" width="18" height="46"/>
      <rect x="424" y="510" width="18" height="30"/>
      <rect x="446" y="504" width="18" height="36"/>
    </g>
    <!-- highlight AACC/GGTT bar -->
    <rect x="204" y="490" width="18" height="50" fill="#E8663A"/>
    <line x1="213" y1="490" x2="213" y2="462" stroke="#E8663A" stroke-width="1"/>
    <text x="213" y="456" class="lab" fill="#E8663A" text-anchor="middle" font-weight="700">AACC/GGTT</text>
    <text x="265" y="558" class="lab" text-anchor="middle">136 tetranucleótidos canónicos</text>
  </g>

  <!-- payoff note -->
  <rect x="492" y="462" width="164" height="96" rx="10" fill="#f5faf9" stroke="#cfe6e0" stroke-width="1.3"/>
  <text x="574" y="484" class="cap" text-anchor="middle" font-weight="700" fill="#027373">= la firma del contig</text>
  <text x="504" y="506" class="lab">Los contigs de un</text>
  <text x="504" y="522" class="lab">mismo genoma comparten</text>
  <text x="504" y="538" class="lab">esta firma. Es la señal de</text>
  <text x="504" y="554" class="lab">"composición" del binning.</text>
  <line x1="30" y1="576" x2="650" y2="576" stroke="#eef1f3" stroke-width="1.5"/>

  <!-- STEP 4 -->
  <text x="30" y="604" class="step">4 · La firma de cada contig se proyecta a un espacio; los de un mismo genoma se agrupan</text>

  <!-- mini signatures -->
  <text x="73" y="626" class="lab" text-anchor="middle">firma de</text>
  <text x="73" y="640" class="lab" text-anchor="middle">cada contig</text>
  <g stroke-width="0.6">
    <g fill="#027373" stroke="#025b5b" transform="translate(50,648)">
      <rect x="0" y="6" width="6" height="12"/><rect x="8" y="0" width="6" height="18"/><rect x="16" y="9" width="6" height="9"/><rect x="24" y="3" width="6" height="15"/><rect x="32" y="7" width="6" height="11"/><rect x="40" y="1" width="6" height="17"/>
    </g>
    <g fill="#027373" stroke="#025b5b" transform="translate(50,678)">
      <rect x="0" y="5" width="6" height="13"/><rect x="8" y="1" width="6" height="17"/><rect x="16" y="8" width="6" height="10"/><rect x="24" y="2" width="6" height="16"/><rect x="32" y="6" width="6" height="12"/><rect x="40" y="0" width="6" height="18"/>
    </g>
    <g fill="#E8663A" stroke="#b64420" transform="translate(50,708)">
      <rect x="0" y="1" width="6" height="17"/><rect x="8" y="8" width="6" height="10"/><rect x="16" y="2" width="6" height="16"/><rect x="24" y="10" width="6" height="8"/><rect x="32" y="4" width="6" height="14"/><rect x="40" y="9" width="6" height="9"/>
    </g>
  </g>

  <!-- arrow -->
  <text x="140" y="672" class="lab" text-anchor="middle">proyectar</text>
  <line x1="108" y1="682" x2="172" y2="682" stroke="#027373" stroke-width="2" marker-end="url(#ar)"/>

  <!-- ordination scatter -->
  <line x1="205" y1="715" x2="460" y2="715" stroke="#8a97a3" stroke-width="1.4"/>
  <line x1="205" y1="715" x2="205" y2="622" stroke="#8a97a3" stroke-width="1.4"/>
  <text x="332" y="734" class="lab" text-anchor="middle">componente 1</text>
  <text x="193" y="670" class="lab" text-anchor="middle" transform="rotate(-90 193 670)">componente 2</text>

  <ellipse cx="278" cy="663" rx="36" ry="30" fill="none" stroke="#027373" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g fill="#027373">
    <circle cx="268" cy="658" r="5"/><circle cx="286" cy="670" r="5"/><circle cx="272" cy="676" r="5"/><circle cx="290" cy="656" r="5"/>
  </g>
  <ellipse cx="398" cy="690" rx="36" ry="30" fill="none" stroke="#E8663A" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g fill="#E8663A">
    <circle cx="388" cy="685" r="5"/><circle cx="406" cy="697" r="5"/><circle cx="393" cy="702" r="5"/><circle cx="410" cy="684" r="5"/>
  </g>

  <!-- legend + caption -->
  <circle cx="490" cy="646" r="5" fill="#027373"/><text x="503" y="650" class="lab">genoma A</text>
  <circle cx="490" cy="668" r="5" fill="#E8663A"/><text x="503" y="672" class="lab">genoma B</text>
  <text x="478" y="700" class="cap">Cada punto = un contig,</text>
  <text x="478" y="716" class="cap">ubicado por su firma.</text>
</svg>

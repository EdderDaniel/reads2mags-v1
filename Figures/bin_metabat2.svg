<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ax" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8a97a3"/>
    </marker>
    <style>
      .ttl {font-size:23px;font-weight:700;fill:#027373;}
      .sub {font-size:12.5px;fill:#6b7a89;}
      .cap {font-size:12px;fill:#42505e;}
      .axl {font-size:11.5px;fill:#6b7a89;}
      .lgd {font-size:11px;fill:#42505e;}
    </style>
  </defs>
  <rect x="6" y="6" width="588" height="458" rx="14" fill="#ffffff" stroke="#e2e6ea" stroke-width="1.5"/>
  <text x="34" y="44" class="ttl">MetaBAT2</text>
  <text x="34" y="66" class="sub">cobertura + composición → distancia → agrupamiento</text>

  <!-- axes -->
  <line x1="95" y1="358" x2="530" y2="358" stroke="#8a97a3" stroke-width="1.6" marker-end="url(#ax)"/>
  <line x1="95" y1="358" x2="95" y2="105" stroke="#8a97a3" stroke-width="1.6" marker-end="url(#ax)"/>
  <text x="312" y="382" class="axl" text-anchor="middle">composición (frecuencia de tetranucleótidos)</text>
  <text x="78" y="235" class="axl" text-anchor="middle" transform="rotate(-90 78 235)">cobertura</text>

  <!-- cluster A teal -->
  <ellipse cx="178" cy="182" rx="44" ry="40" fill="none" stroke="#027373" stroke-width="1.6" stroke-dasharray="5 4"/>
  <g fill="#027373">
    <circle cx="166" cy="176" r="5.5"/><circle cx="186" cy="192" r="5.5"/><circle cx="158" cy="198" r="5.5"/>
    <circle cx="193" cy="168" r="5.5"/><circle cx="175" cy="205" r="5.5"/>
  </g>
  <!-- cluster B coral -->
  <ellipse cx="315" cy="272" rx="44" ry="40" fill="none" stroke="#E8663A" stroke-width="1.6" stroke-dasharray="5 4"/>
  <g fill="#E8663A">
    <circle cx="305" cy="266" r="5.5"/><circle cx="326" cy="282" r="5.5"/><circle cx="300" cy="288" r="5.5"/>
    <circle cx="339" cy="262" r="5.5"/><circle cx="318" cy="296" r="5.5"/>
  </g>
  <!-- cluster C amber -->
  <ellipse cx="448" cy="188" rx="44" ry="40" fill="none" stroke="#E0A13C" stroke-width="1.6" stroke-dasharray="5 4"/>
  <g fill="#E0A13C">
    <circle cx="436" cy="182" r="5.5"/><circle cx="458" cy="196" r="5.5"/><circle cx="447" cy="166" r="5.5"/>
    <circle cx="465" cy="184" r="5.5"/><circle cx="432" cy="205" r="5.5"/>
  </g>

  <text x="34" y="418" class="cap">Calcula la distancia entre todos los contigs según su cobertura y su composición de</text>
  <text x="34" y="436" class="cap">tetranucleótidos, y agrupa por cercanía. Cada nube de puntos cercanos es un bin.</text>
</svg>
